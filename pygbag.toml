height = 600
title = "PyCraft - Web Edition"

# Assets to include (sounds, textures, etc.)
# Note: Large files will slow down loading
assets = [
    # Add your texture files here
    # "Textures/",
    # "Sounds/",
]

#For orientation, use "portrait" or "landscape"
orientation = "landscape"

